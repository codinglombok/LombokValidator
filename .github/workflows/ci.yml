# Salin ke <Repo>/.github/workflows/ci.yml  (ganti LombokValidator & lombokvalidator)
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lombok-ci:
    uses: codinglombok/.github/.github/workflows/lombok-ci.yml@main
    with:
      repo_name: LombokValidator
      package_name: lombokvalidator
